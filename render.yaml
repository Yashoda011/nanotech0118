# Render one-click backend: FastAPI + managed Postgres.
# Dashboard: New → Blueprint → select Yashoda011/nanotech0118 → Apply.
# After deploy: copy the service URL as VITE_API_URL in Vercel, and put the
# Vercel domain into CORS_ORIGINS below, then redeploy both.

services:
  - type: web
    name: nanosphere-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nanosphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: https://nanotech0118.vercel.app
        sync: false
      - key: ADMIN_EMAILS
        value: admin@nanosphere.io
        sync: false
      - key: DEV_MAILBOX
        value: "false"
      - key: FREE_OFFER_ENDS_AT
        value: 2026-10-31T00:00:00+00:00
      - key: RESEARCH_API_URL
        value: https://api.semanticscholar.org/graph/v1/paper/search

databases:
  - name: nanosphere-db
    plan: free
