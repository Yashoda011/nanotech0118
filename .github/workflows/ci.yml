# CI: typecheck + build + backend suites on every push/PR.
# No secrets needed. Fails fast before any deploy runs.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Start API under test
        run: |
          python -m uvicorn backend.app.main:app --port 8000 --host 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8000/health
      - run: python backend/verify_full.py
      - run: python backend/verify_adversarial.py
