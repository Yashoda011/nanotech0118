server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app fallback — every route serves index.html (200).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets cache.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
